<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Orbs -->
  <circle cx="200" cy="150" r="180" fill="url(#glow)">
    <animate attributeName="cx" values="150;250;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="160;200;160" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="150" r="220" fill="url(#glow)">
    <animate attributeName="cx" values="1050;950;1050" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="r" values="200;240;200" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Cloud Grid & Wave Lines (Background Layer) -->
  <g opacity="0.15">
    <path d="M 0 100 Q 300 40 600 100 T 1200 100 V 300 H 0 Z" fill="#38bdf8">
      <animate attributeName="d" values="M 0 100 Q 300 40 600 100 T 1200 100 V 300 H 0 Z; M 0 120 Q 300 160 600 120 T 1200 120 V 300 H 0 Z; M 0 100 Q 300 40 600 100 T 1200 100 V 300 H 0 Z" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 180 Q 400 240 800 180 T 1200 180 V 300 H 0 Z" fill="#818cf8">
      <animate attributeName="d" values="M 0 180 Q 400 240 800 180 T 1200 180 V 300 H 0 Z; M 0 160 Q 400 120 800 160 T 1200 160 V 300 H 0 Z; M 0 180 Q 400 240 800 180 T 1200 180 V 300 H 0 Z" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Pulsing Cloud Icon Graphic (Left Background Element) -->
  <g transform="translate(90, 85)" opacity="0.3">
    <path d="M 65 35 A 25 25 0 0 1 110 35 A 20 20 0 0 1 130 65 A 15 15 0 0 1 125 90 L 35 90 A 20 20 0 0 1 30 50 A 25 25 0 0 1 65 35 Z" fill="none" stroke="#38bdf8" stroke-width="4">
      <animate attributeName="stroke-dasharray" values="0 400; 400 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Pulsing Shield Icon Graphic (Right Background Element) -->
  <g transform="translate(1040, 85)" opacity="0.3">
    <path d="M 50 15 L 90 30 V 70 C 90 95 50 115 50 115 C 50 115 10 95 10 70 V 30 Z" fill="none" stroke="#c084fc" stroke-width="4">
      <animate attributeName="stroke-dasharray" values="0 400; 400 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground Text Content (Prominent and Unobscured) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5">
      Awesome Enterprise Cloud Support &amp; Advisory
    </text>

    <!-- Subtitle -->
    <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="url(#subGrad)" letter-spacing="0.2">
      🛟 Commercial 24/7 Support Programs • Open-Source Governance • FinOps &amp; Compliance Toolkits 🏢
    </text>

    <!-- Interactive Badges / Tags in Banner -->
    <g transform="translate(600, 220)">
      <!-- Tag 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">AWS • Azure • GCP</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(0, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
        <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">FinOps &amp; Governance</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(240, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
        <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">24/7 Advisory SLAs</text>
      </g>
    </g>
  </g>
</svg>
